<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CR7 GOAT AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #fffdf5 0%,
                    #ffffff 45%,
                    #f1f1f1 100%
                );

            color: #111;

            overflow: hidden;
        }


        /* MAIN */

        .container {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 35px;

            position: relative;
        }


        /* TOP DECORATION */

        .top-line {
            width: 100px;
            height: 3px;

            background: #d9a927;

            margin-bottom: 12px;

            border-radius: 10px;
        }


        /* CROWN */

        .crown {
            font-size: 38px;

            color: #d9a927;

            margin-bottom: 3px;

            filter:
                drop-shadow(
                    0 3px 5px
                    rgba(0,0,0,0.15)
                );
        }


        /* CR7 */

        .cr7 {
            font-size: 80px;

            font-weight: 900;

            letter-spacing: -5px;

            line-height: 0.9;

            background:
                linear-gradient(
                    180deg,
                    #171717,
                    #555,
                    #111
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        /* GOAT AI */

        .goat {
            font-size: 58px;

            font-weight: 900;

            font-style: italic;

            letter-spacing: -3px;

            background:
                linear-gradient(
                    180deg,
                    #f4cf5b,
                    #d39b16
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 3px 4px
                    rgba(0,0,0,0.15)
                );
        }


        /* TAGLINE */

        .tagline {
            margin-top: 12px;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 6px;

            color: #666;
        }

        .tagline span {
            color: #d9a927;

            margin: 0 8px;
        }


        /* SONG INPUT */

        .song-box {

            width: min(620px, 85vw);

            height: 70px;

            margin-top: 50px;

            border: 2px solid #d8aa32;

            border-radius: 40px;

            background: rgba(255,255,255,0.9);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 28px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            transition: 0.3s;
        }


        .song-box:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.12);
        }


        .song-text {

            font-size: 22px;

            color: #777;
        }


        .music {

            font-size: 30px;

            color: #d39b16;
        }


        /* =========================
           FOOTBALL + MIC BUTTON
           ========================= */

        .mic-area {

            margin-top: 55px;

            position: relative;

            width: 280px;

            height: 280px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* GOLD GLOW */

        .mic-glow {

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                rgba(221,171,43,0.16);

            filter: blur(25px);
        }


        /* MAIN BUTTON */

        .mic-button {

            position: relative;

            width: 245px;
            height: 245px;

            border-radius: 50%;

            border: 6px solid #d9a927;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f4f4f4
                );

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:

                0 8px 20px
                rgba(0,0,0,0.12),

                0 0 0 10px
                rgba(217,169,39,0.08),

                0 0 35px
                rgba(217,169,39,0.25);

            transition: 0.3s ease;
        }


        .mic-button:hover {

            transform: scale(1.05);

            box-shadow:

                0 12px 25px
                rgba(0,0,0,0.15),

                0 0 0 15px
                rgba(217,169,39,0.10),

                0 0 55px
                rgba(217,169,39,0.40);
        }


        .mic-button:active {

            transform: scale(0.95);
        }


        /* FOOTBALL */

        .football {

            width: 125px;

            height: 125px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff,
                    #eeeeee
                );

            border: 4px solid #222;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 5px 10px
                rgba(0,0,0,0.18);

            overflow: hidden;
        }


        /* FOOTBALL PENTAGON */

        .football::before {

            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            background: #222;

            clip-path: polygon(
                50% 0%,
                100% 35%,
                82% 100%,
                18% 100%,
                0% 35%
            );
        }


        /* FOOTBALL LINES */

        .football::after {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            border: 3px dashed #333;

            transform: rotate(35deg);

            opacity: 0.65;
        }


        /* MICROPHONE INSIDE FOOTBALL */

        .mini-mic {

            position: relative;

            z-index: 5;

            width: 42px;

            height: 65px;

            border: 6px solid #d4a21f;

            border-radius: 25px;

            background: #fff;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.15);
        }


        /* MIC U-SHAPE */

        .mini-mic::before {

            content: "";

            position: absolute;

            width: 68px;

            height: 55px;

            border: 6px solid #d4a21f;

            border-top: none;

            border-radius:
                0 0 40px 40px;

            left: 50%;

            top: 25px;

            transform:
                translateX(-50%);
        }


        /* MIC STEM */

        .mini-mic::after {

            content: "";

            position: absolute;

            width: 6px;

            height: 25px;

            background: #d4a21f;

            left: 50%;

            bottom: -48px;

            transform:
                translateX(-50%);
        }


        /* MIC BASE */

        .mic-base {

            position: absolute;

            z-index: 6;

            width: 42px;

            height: 6px;

            background: #d4a21f;

            border-radius: 10px;

            bottom: 63px;

            left: 50%;

            transform:
                translateX(-50%);
        }


        /* STATUS */

        .status {

            margin-top: 38px;

            padding: 12px 38px;

            border-radius: 30px;

            background: white;

            border: 1px solid #ddd;

            color: #555;

            font-size: 17px;

            font-weight: 600;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.07);
        }


        /* FOOTER */

        .footer {

            position: absolute;

            bottom: 25px;

            display: flex;

            align-items: center;

            gap: 20px;

            color: #999;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 5px;
        }


        .line {

            width: 70px;

            height: 2px;

            background: #d9a927;
        }


        /* MOBILE */

        @media(max-width:600px) {

            .cr7 {
                font-size: 65px;
            }

            .goat {
                font-size: 45px;
            }

            .tagline {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .song-box {
                margin-top: 40px;
            }

            .song-text {
                font-size: 18px;
            }

            .mic-area {
                margin-top: 45px;
            }

            .mic-button {
                width: 215px;
                height: 215px;
            }

            .football {
                width: 110px;
                height: 110px;
            }

            .footer {
                font-size: 8px;
                letter-spacing: 2px;
            }

            .line {
                width: 35px;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <div class="top-line"></div>

    <div class="crown">♛</div>

    <div class="cr7">
        CR7
    </div>

    <div class="goat">
        GOAT AI
    </div>

    <div class="tagline">

        SPEAK
        <span>•</span>
        LISTEN
        <span>•</span>
        BE INSPIRED

    </div>


    <!-- SONG -->

    <div class="song-box">

        <div class="song-text">
            Say a song name
        </div>

        <div class="music">
            ♪
        </div>

    </div>


    <!-- FOOTBALL + MICROPHONE -->

    <div class="mic-area">

        <div class="mic-glow"></div>

        <button
            id="mic"
            class="mic-button"
        >

            <div class="football">

                <div class="mini-mic"></div>

            </div>

            <div class="mic-base"></div>

        </button>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        ⚽ Tap to Speak
    </div>


    <!-- FOOTER -->

    <div class="footer">

        <div class="line"></div>

        CR7 GOAT MINDSET

        <div class="line"></div>

    </div>

</div>


<script>

    const mic =
        document.getElementById("mic");

    const status =
        document.getElementById("status");


    let listening = false;


    mic.addEventListener(
        "click",
        () => {

            listening = !listening;


            if (listening) {

                status.innerHTML =
                    "🎙️ Listening...";

                mic.style.transform =
                    "scale(1.07)";

                mic.style.boxShadow =
                    `
                    0 0 0 15px
                    rgba(217,169,39,0.12),

                    0 0 60px
                    rgba(217,169,39,0.6)
                    `;

            }

            else {

                status.innerHTML =
                    "⚽ Tap to Speak";

                mic.style.transform =
                    "scale(1)";

                mic.style.boxShadow =
                    `
                    0 8px 20px
                    rgba(0,0,0,0.12),

                    0 0 0 10px
                    rgba(217,169,39,0.08),

                    0 0 35px
                    rgba(217,169,39,0.25)
                    `;
            }

        }
    );

</script>

</body>
</html>
