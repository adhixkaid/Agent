<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CR7 GOAT AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 35%, #29200d 0%, #0c0c0c 35%, #050505 75%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Main container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 35px;
            overflow: hidden;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 190, 40, 0.08);
            filter: blur(100px);
            border-radius: 50%;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* Crown */
        .crown {
            font-size: 45px;
            color: #ffd45a;
            filter: drop-shadow(0 0 12px rgba(255, 196, 55, 0.8));
            margin-bottom: 5px;
        }

        /* CR7 */
        .cr7 {
            font-size: 82px;
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.9;
            background: linear-gradient(
                180deg,
                #ffffff,
                #d9d9d9,
                #ffffff
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,255,255,0.15);
        }

        /* GOAT AI */
        .goat {
            font-size: 62px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;
            margin-top: 5px;

            background: linear-gradient(
                180deg,
                #ffe48a,
                #f5b52c,
                #c98200
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 5px 10px rgba(255, 185, 30, 0.25));
        }

        /* Tagline */
        .tagline {
            margin-top: 18px;
            font-size: 14px;
            letter-spacing: 7px;
            color: #cfcfcf;
            text-align: center;
        }

        .tagline span {
            color: #eab936;
            margin: 0 10px;
        }

        /* Song input */
        .song-box {
            width: min(650px, 85vw);
            height: 75px;
            margin-top: 65px;

            border: 2px solid #dca82d;
            border-radius: 45px;

            background: rgba(15, 15, 15, 0.85);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            box-shadow:
                0 0 15px rgba(218, 168, 45, 0.25),
                inset 0 0 20px rgba(255, 190, 30, 0.04);
        }

        .song-text {
            font-size: 25px;
            color: #dedede;
        }

        .music {
            font-size: 30px;
            color: #f4bd32;
        }

        /* Microphone area */
        .mic-wrapper {
            margin-top: 70px;
            position: relative;
        }

        /* Outer glow */
        .mic-glow {
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: rgba(255, 196, 55, 0.18);
            filter: blur(35px);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Main microphone button */
        .mic-button {
            position: relative;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            border: 5px solid #f4c64f;

            background:
                radial-gradient(
                    circle,
                    #211b0e 0%,
                    #0c0c0c 70%
                );

            color: #f5c74e;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 0 15px #e4ad32,
                0 0 45px rgba(238, 180, 45, 0.5),
                inset 0 0 25px rgba(255, 190, 40, 0.12);

            transition: 0.3s ease;
        }

        .mic-button:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 20px #ffd65c,
                0 0 70px rgba(255, 190, 40, 0.7),
                inset 0 0 35px rgba(255, 190, 40, 0.2);
        }

        .mic-button:active {
            transform: scale(0.96);
        }

        /* Microphone icon */
        .microphone {
            width: 75px;
            height: 105px;

            border: 9px solid #f5c74e;
            border-radius: 45px;

            position: relative;
        }

        .microphone::before {
            content: "";

            position: absolute;

            width: 115px;
            height: 100px;

            border: 9px solid #f5c74e;
            border-top: none;

            border-radius: 0 0 70px 70px;

            left: 50%;
            top: 45px;

            transform: translateX(-50%);
        }

        .microphone::after {
            content: "";

            position: absolute;

            width: 9px;
            height: 38px;

            background: #f5c74e;

            left: 50%;
            bottom: -70px;

            transform: translateX(-50%);
        }

        /* Mic stand */
        .mic-stand {
            position: absolute;

            width: 65px;
            height: 9px;

            background: #f5c74e;

            bottom: -75px;
            left: 50%;

            transform: translateX(-50%);
            border-radius: 10px;
        }

        /* Status */
        .status {
            margin-top: 70px;

            padding: 12px 45px;

            border: 1px solid #454545;
            border-radius: 30px;

            background: rgba(15, 15, 15, 0.8);

            color: #cfcfcf;

            font-size: 18px;

            box-shadow: 0 0 15px rgba(255,255,255,0.04);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 35px;

            display: flex;
            align-items: center;
            gap: 25px;

            color: #999;

            font-size: 13px;
            letter-spacing: 6px;
        }

        .line {
            width: 80px;
            height: 2px;
            background: #dca82d;
        }

        /* Small screens */
        @media (max-width: 600px) {

            .cr7 {
                font-size: 65px;
            }

            .goat {
                font-size: 45px;
            }

            .tagline {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .song-box {
                margin-top: 45px;
                height: 65px;
            }

            .song-text {
                font-size: 19px;
            }

            .mic-wrapper {
                margin-top: 55px;
            }

            .mic-button {
                width: 220px;
                height: 220px;
            }

            .footer {
                font-size: 9px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="glow"></div>

    <!-- Logo -->
    <div class="crown">♛</div>

    <div class="cr7">CR7</div>

    <div class="goat">GOAT AI</div>

    <div class="tagline">
        SPEAK
        <span>•</span>
        LISTEN
        <span>•</span>
        BE INSPIRED
    </div>


    <!-- Song input -->
    <div class="song-box">

        <div class="song-text">
            Say a song name
        </div>

        <div class="music">
            ♪
        </div>

    </div>


    <!-- Microphone -->
    <div class="mic-wrapper">

        <div class="mic-glow"></div>

        <button id="mic" class="mic-button">

            <div class="microphone">
                <div class="mic-stand"></div>
            </div>

        </button>

    </div>


    <!-- Status -->
    <div id="status" class="status">
        Tap Microphone
    </div>


    <!-- Footer -->
    <div class="footer">

        <div class="line"></div>

        GOAT MINDSET FOR A BETTER YOU

        <div class="line"></div>

    </div>

</div>


<script>

    const mic = document.getElementById("mic");
    const status = document.getElementById("status");

    let listening = false;

    mic.addEventListener("click", () => {

        listening = !listening;

        if (listening) {

            status.innerHTML = "🎙 Listening...";

            mic.style.boxShadow =
                "0 0 25px #ffd65c, 0 0 90px rgba(255,190,40,0.9)";

        } else {

            status.innerHTML = "Tap Microphone";

            mic.style.boxShadow =
                "0 0 15px #e4ad32, 0 0 45px rgba(238,180,45,0.5)";

        }

    });

</script>

</body>
</html>
