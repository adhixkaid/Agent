<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CR7 GOAT AI</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #fffdf5 0%,
                    #ffffff 45%,
                    #eeeeee 100%
                );

            color: #111;

            overflow-x: hidden;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding-top: 45px;

            position: relative;
        }


        /* =========================
           TOP LINE
        ========================= */

        .top-line {

            width: 90px;

            height: 3px;

            background: #d7a51e;

            border-radius: 10px;

            margin-bottom: 15px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            font-size: 72px;

            font-weight: 900;

            letter-spacing: -4px;

            line-height: 1;
        }


        .cr7 {

            color: #111;
        }


        .goat-ai {

            color: #d63227;

            margin-left: 12px;
        }


        /* =========================
           TAGLINE
        ========================= */

        .tagline {

            margin-top: 22px;

            font-size: 18px;

            color: #666;

            text-align: center;

            letter-spacing: 0.5px;
        }


        /* =========================
           SONG BOX
        ========================= */

        .song-box {

            width: min(850px, 86vw);

            min-height: 85px;

            margin-top: 55px;

            background: white;

            border-radius: 25px;

            border: 1px solid #eeeeee;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.08);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px 30px;

            transition: 0.3s;
        }


        .song-text {

            font-size: 22px;

            color: #222;

            text-align: center;

            word-break: break-word;
        }


        .placeholder {

            color: #888;
        }


        /* =========================
           MIC AREA
        ========================= */

        .mic-area {

            margin-top: 55px;

            width: 280px;

            height: 280px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* Glow */

        .mic-glow {

            position: absolute;

            width: 240px;

            height: 240px;

            border-radius: 50%;

            background:
                rgba(215,165,30,0.16);

            filter: blur(35px);

            transition: 0.3s;
        }


        /* =========================
           MAIN MIC BUTTON
        ========================= */

        .mic-button {

            width: 245px;

            height: 245px;

            border-radius: 50%;

            border: 7px solid #d7a51e;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f4f4f4
                );

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            box-shadow:

                0 10px 25px
                rgba(0,0,0,0.12),

                0 0 0 10px
                rgba(215,165,30,0.08),

                0 0 40px
                rgba(215,165,30,0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .mic-button:hover {

            transform: scale(1.05);

            box-shadow:

                0 15px 30px
                rgba(0,0,0,0.15),

                0 0 0 15px
                rgba(215,165,30,0.10),

                0 0 65px
                rgba(215,165,30,0.4);
        }


        .mic-button:active {

            transform: scale(0.94);
        }


        /* =========================
           FOOTBALL
        ========================= */

        .football {

            width: 125px;

            height: 125px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #e8e8e8
                );

            border: 4px solid #151515;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 5px 12px
                rgba(0,0,0,0.18);

            overflow: hidden;
        }


        /* Football black center */

        .football-center {

            position: absolute;

            width: 34px;

            height: 34px;

            background: #151515;

            clip-path:
                polygon(
                    50% 0%,
                    100% 35%,
                    82% 100%,
                    18% 100%,
                    0% 35%
                );

            z-index: 1;
        }


        /* Football pattern */

        .football-line {

            position: absolute;

            width: 150px;

            height: 150px;

            border: 3px solid #222;

            border-radius: 50%;

            opacity: 0.65;
        }


        .line-one {

            transform: rotate(45deg);

        }


        .line-two {

            transform:
                rotate(-45deg);

        }


        /* =========================
           MICROPHONE INSIDE BALL
        ========================= */

        .mini-mic {

            width: 40px;

            height: 61px;

            border: 6px solid #d7a51e;

            border-radius: 25px;

            background: white;

            position: relative;

            z-index: 5;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.2);
        }


        /* Mic U shape */

        .mini-mic::before {

            content: "";

            position: absolute;

            width: 67px;

            height: 52px;

            border: 6px solid #d7a51e;

            border-top: none;

            border-radius:
                0 0 40px 40px;

            left: 50%;

            top: 23px;

            transform:
                translateX(-50%);
        }


        /* Mic stem */

        .mini-mic::after {

            content: "";

            position: absolute;

            width: 6px;

            height: 25px;

            background: #d7a51e;

            left: 50%;

            bottom: -48px;

            transform:
                translateX(-50%);
        }


        /* Mic base */

        .mic-base {

            position: absolute;

            width: 43px;

            height: 6px;

            background: #d7a51e;

            border-radius: 10px;

            bottom: 72px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 7;
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            margin-top: 35px;

            padding: 14px 35px;

            min-width: 300px;

            text-align: center;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 30px;

            color: #222;

            font-size: 18px;

            font-weight: 600;

            box-shadow:
                0 7px 20px
                rgba(0,0,0,0.07);
        }


        /* =========================
           LISTENING ANIMATION
        ========================= */

        .listening {

            animation:
                pulse 1.2s infinite;
        }


        @keyframes pulse {

            0% {

                box-shadow:
                    0 0 0 0
                    rgba(215,165,30,0.5);
            }

            70% {

                box-shadow:
                    0 0 0 25px
                    rgba(215,165,30,0);
            }

            100% {

                box-shadow:
                    0 0 0 0
                    rgba(215,165,30,0);
            }
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            position: absolute;

            bottom: 25px;

            display: flex;

            align-items: center;

            gap: 20px;

            color: #999;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 4px;

            text-align: center;
        }


        .footer-line {

            width: 65px;

            height: 2px;

            background: #d7a51e;

            border-radius: 5px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 600px) {

            .container {

                padding-top: 30px;
            }


            .logo {

                font-size: 52px;

                letter-spacing: -3px;
            }


            .goat-ai {

                margin-left: 6px;
            }


            .tagline {

                font-size: 15px;

                padding: 0 20px;
            }


            .song-box {

                margin-top: 40px;

                min-height: 75px;
            }


            .song-text {

                font-size: 18px;
            }


            .mic-area {

                margin-top: 45px;

                transform:
                    scale(0.9);
            }


            .status {

                margin-top: 20px;

                min-width: 270px;

                font-size: 16px;
            }


            .footer {

                font-size: 8px;

                letter-spacing: 2px;
            }


            .footer-line {

                width: 30px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- TOP -->

    <div class="top-line"></div>


    <!-- LOGO -->

    <div class="logo">

        <span class="cr7">
            CR7
        </span>

        <span class="goat-ai">
            GOAT AI
        </span>

    </div>


    <!-- TAGLINE -->

    <div class="tagline">

        Say what you want — search YouTube instantly.

    </div>


    <!-- SONG / COMMAND BOX -->

    <div class="song-box">

        <div
            id="command"
            class="song-text placeholder"
        >

            Your command will appear here...

        </div>

    </div>


    <!-- MICROPHONE -->

    <div class="mic-area">

        <div
            id="micGlow"
            class="mic-glow"
        ></div>


        <button
            id="mic"
            class="mic-button"
            aria-label="Start voice recognition"
        >

            <div class="football">

                <div class="football-center"></div>

                <div
                    class="football-line line-one"
                ></div>

                <div
                    class="football-line line-two"
                ></div>


                <!-- Microphone -->

                <div class="mini-mic"></div>

            </div>


            <div class="mic-base"></div>

        </button>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        ⚽ Tap to Speak

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <div class="footer-line"></div>

        CR7 GOAT MINDSET

        <div class="footer-line"></div>

    </div>


</div>



<script>


/* =====================================
   ELEMENTS
===================================== */

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const command =
    document.getElementById("command");

const micGlow =
    document.getElementById("micGlow");



/* =====================================
   SPEECH RECOGNITION
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;



/* =====================================
   CHECK SUPPORT
===================================== */

if (!SpeechRecognition) {

    status.innerHTML =
        "❌ Voice recognition is not supported";

    mic.disabled = true;

}



/* =====================================
   CREATE RECOGNITION
===================================== */

else {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;



    /* =================================
       MIC CLICK
    ================================= */

    mic.addEventListener(
        "click",
        function() {


            status.innerHTML =
                "🎙️ Listening... Speak now!";


            command.innerHTML =
                "Listening for your command...";


            command.classList.remove(
                "placeholder"
            );


            mic.classList.add(
                "listening"
            );


            micGlow.style.background =
                "rgba(215,165,30,0.30)";


            try {

                recognition.start();

            }

            catch(error) {

                console.log(
                    "Recognition already running."
                );

            }

        }
    );



    /* =================================
       SPEECH START
    ================================= */

    recognition.onstart =
        function() {

            status.innerHTML =
                "🎙️ Listening...";

        };



    /* =================================
       SPEECH RESULT
    ================================= */

    recognition.onresult =
        function(event) {


            const transcript =
                event
                .results[0][0]
                .transcript
                .trim();


            console.log(
                "You said:",
                transcript
            );


            /* Show command */

            command.innerHTML =
                "🎤 " + transcript;


            status.innerHTML =
                "⚽ Got it!";


            /* Stop animation */

            mic.classList.remove(
                "listening"
            );


            micGlow.style.background =
                "rgba(215,165,30,0.16)";


            /*
             * SEARCH YOUTUBE
             *
             * Wait a moment so the user
             * can see what was recognized.
             */

            setTimeout(
                function() {

                    const youtubeURL =
                        "https://www.youtube.com/results?search_query=" +
                        encodeURIComponent(transcript);


                    window.open(
                        youtubeURL,
                        "_blank"
                    );


                    status.innerHTML =
                        "▶️ Searching YouTube...";

                },
                700
            );

        };



    /* =================================
       SPEECH END
    ================================= */

    recognition.onend =
        function() {


            mic.classList.remove(
                "listening"
            );


            micGlow.style.background =
                "rgba(215,165,30,0.16)";


            /*
             * Don't overwrite
             * successful result.
             */

            if (
                status.innerHTML ===
                "🎙️ Listening..."
            ) {

                status.innerHTML =
                    "⚽ Tap to Speak";

            }

        };



    /* =================================
       ERRORS
    ================================= */

    recognition.onerror =
        function(event) {


            console.log(
                "Speech recognition error:",
                event.error
            );


            mic.classList.remove(
                "listening"
            );


            micGlow.style.background =
                "rgba(215,165,30,0.16)";


            if (
                event.error ===
                "not-allowed"
            ) {

                status.innerHTML =
                    "🎙️ Please allow microphone access";


                command.innerHTML =
                    "Microphone permission is blocked.";


            }


            else if (
                event.error ===
                "no-speech"
            ) {

                status.innerHTML =
                    "😶 Couldn't hear you. Try again";


                command.innerHTML =
                    "Speak closer to your microphone.";


            }


            else if (
                event.error ===
                "audio-capture"
            ) {

                status.innerHTML =
                    "❌ Microphone not found";


                command.innerHTML =
                    "Check your microphone connection.";


            }


            else if (
                event.error ===
                "network"
            ) {

                status.innerHTML =
                    "🌐 Speech service unavailable";


                command.innerHTML =
                    "Check your internet connection.";


            }


            else {

                status.innerHTML =
                    "❌ Try again";


                command.innerHTML =
                    "Something went wrong.";

            }

        };

}

</script>


</body>

</html>
